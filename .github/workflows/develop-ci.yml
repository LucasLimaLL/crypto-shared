name: Develop CI - Build, Test, Lint & Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Test
        run: ./gradlew test

      - name: Lint
        run: ./gradlew check

  create-release-branch:
    needs: build-test-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        run: |
          # Get the latest release tag or default to 0.0.0
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            MAJOR=0
            MINOR=0
            PATCH=0
            COMMIT_RANGE="HEAD"
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            COMMIT_RANGE="${LATEST_TAG}..HEAD"
          fi

          echo "Current version: ${MAJOR}.${MINOR}.${PATCH}"

          # Analyze commits since the last tag
          BUMP="patch"

          if [ "$COMMIT_RANGE" = "HEAD" ]; then
            SUBJECTS=$(git log --pretty=format:"%s" HEAD)
            BODIES=$(git log --pretty=format:"%b" HEAD)
          else
            SUBJECTS=$(git log --pretty=format:"%s" "$COMMIT_RANGE")
            BODIES=$(git log --pretty=format:"%b" "$COMMIT_RANGE")
          fi

          # Check for breaking changes (major bump)
          # Breaking changes can appear as "!" before ":" in subject or "BREAKING CHANGE" in body
          if echo "$BODIES" | grep -qiE 'BREAKING CHANGE|BREAKING-CHANGE' || \
             echo "$SUBJECTS" | grep -qiE '^[a-z]+(\(.+\))?!:'; then
            BUMP="major"
          # Check for new features (minor bump)
          elif echo "$SUBJECTS" | grep -qiE '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          echo "Bump type: $BUMP"

          # Increment version based on bump type
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          BRANCH_NAME="release/${NEW_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if the branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" > /dev/null 2>&1; then
            echo "Branch $BRANCH_NAME already exists. Skipping creation."
          else
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"
            echo "Created and pushed branch: $BRANCH_NAME"
          fi
